# Render 배포 설정 (백엔드만). 프론트는 Vercel에 올린다.
#
# 무료 플랜의 성질
#   - 15분 정도 요청이 없으면 잠든다. 깨어나는 데 최대 1분쯤 걸린다.
#     프론트가 /api/health 로 먼저 깨우고 "깨우는 중" 안내를 띄운다.
#   - 디스크가 재시작마다 초기화된다. 그래서 AUTO_SEED 로 예시 북을 다시 만든다.
#
# ALLOWED_ORIGINS 는 Vercel 주소를 배포한 뒤에 채운다(미리 알 수 없다).
# Render 대시보드의 Environment 에서 넣거나 아래 값을 고쳐 커밋한다.

services:
  - type: web
    name: trading-risk-engine-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render가 PORT를 주입한다. 0.0.0.0으로 열어야 외부에서 닿는다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_MAX_POSITIONS
        value: "50"
      - key: ALLOWED_ORIGINS
        # 예: https://trading-risk-engine.vercel.app
        # 여러 개면 쉼표로 구분한다. Vercel 미리보기 주소도 넣으려면 함께 적는다.
        sync: false
